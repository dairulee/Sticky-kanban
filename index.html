<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#eee6d6" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />

<title>Sticky Kanban</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
<style>
:root{--ink:#302b25;--muted:#786f63;--paper:#eee6d6;--line:rgba(78,67,53,.12);--cardShadow:0 9px 18px rgba(65,52,35,.18),0 2px 3px rgba(65,52,35,.08);--glass:rgba(251,247,238,.84)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent} html,body{margin:0;min-height:100%;overscroll-behavior:none} body{font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",sans-serif;color:var(--ink);background-color:var(--paper);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px}
button,input,textarea,select{font:inherit} button{color:inherit;cursor:pointer}.app{min-height:100vh;padding:calc(10px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:50;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:8px 0 10px;background:linear-gradient(to bottom,rgba(238,230,214,.98) 72%,rgba(238,230,214,0));backdrop-filter:blur(10px)}
.brand{min-width:0}.brand h1{margin:0;font-size:clamp(28px,4.2vw,43px);line-height:.98;letter-spacing:-.055em;font-weight:950}.brand p{margin:6px 0 0;color:var(--muted);font-size:12px;font-weight:650}.top-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid rgba(70,60,48,.24);background:#fffaf0;border-radius:14px;padding:10px 13px;min-height:44px;font-weight:850;box-shadow:0 3px 8px rgba(50,40,30,.06)}.btn:active{transform:scale(.98)}.btn.primary{background:#302d29;color:white;border-color:#302d29}.btn.icon{width:44px;padding:0;display:grid;place-items:center;font-size:19px}
.boardbar{display:flex;align-items:center;gap:8px;margin:0 0 10px}.tabs{display:flex;gap:8px;overflow:auto;flex:1;padding:2px 1px 7px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap;border:1px solid rgba(70,60,48,.25);background:rgba(255,250,240,.86);border-radius:999px;padding:9px 14px;min-height:40px;font-weight:850}.tab.active{background:#302d29;color:#fff;border-color:#302d29}.seg{display:flex;background:rgba(255,250,240,.74);border:1px solid rgba(70,60,48,.2);border-radius:12px;padding:3px;gap:2px}.seg button{border:0;background:transparent;border-radius:9px;padding:7px 10px;font-size:12px;font-weight:850}.seg button.active{background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.1)}
.board-wrap{overflow-x:auto;padding:4px 2px 28px;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}.board{display:grid;grid-template-columns:repeat(5,minmax(222px,1fr));gap:13px;align-items:start;min-width:max-content}.column{scroll-snap-align:start;min-height:73vh;padding:10px 10px 16px;background:rgba(255,255,255,.36);border:1.5px solid rgba(86,73,55,.18);border-radius:20px;backdrop-filter:blur(3px);transition:.14s}.column.drop-target{outline:3px dashed rgba(48,43,37,.32);outline-offset:-7px;background:rgba(255,255,255,.58)}.col-head{position:sticky;top:76px;z-index:12;display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-1px -1px 11px;padding:7px 6px 10px;border-bottom:2px dashed rgba(70,60,48,.16);background:rgba(247,242,232,.9);backdrop-filter:blur(8px);border-radius:12px}.col-title{font-size:15px;font-weight:950;letter-spacing:-.01em}.col-tools{display:flex;align-items:center;gap:5px}.count{font-size:12px;background:white;border:1px solid rgba(70,60,48,.17);padding:3px 7px;border-radius:999px;font-weight:800}.mini{width:31px;height:31px;border:0;background:transparent;border-radius:9px;font-size:21px;font-weight:900}.mini:active{background:rgba(0,0,0,.07)}
.notes{display:flex;flex-direction:column;gap:13px;min-height:150px}.note{position:relative;min-height:128px;padding:16px 14px 12px;border:1px solid rgba(0,0,0,.06);border-radius:3px 13px 6px 11px;box-shadow:var(--cardShadow);transform:rotate(var(--rot,0deg));touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .12s,box-shadow .12s,opacity .12s}.note::after{content:"";position:absolute;right:-1px;bottom:-1px;width:25px;height:25px;border-bottom-right-radius:10px;background:linear-gradient(135deg,rgba(255,255,255,0) 48%,rgba(0,0,0,.055) 50%,rgba(255,255,255,.25) 52%);pointer-events:none}.note.drag-source{opacity:.18}.note.drag-before{transform:translateY(8px)}.note h3{margin:0 32px 7px 0;font-size:17px;line-height:1.18;font-weight:900}.note .body{font-size:13px;line-height:1.4;white-space:pre-wrap;margin:0 0 10px}.note-menu{position:absolute;right:6px;top:6px;border:0;background:transparent;border-radius:9px;padding:5px 7px;font-size:17px;font-weight:950}.note-menu:active{background:rgba(0,0,0,.08)}.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;font-size:11px;color:rgba(48,43,37,.66);font-weight:700}.due.overdue{color:#a42525;font-weight:950}.done h3,.done .body{text-decoration:line-through;opacity:.55}.yellow{background:#fff09a}.pink{background:#ffc9dc}.blue{background:#bfe8ff}.green{background:#d3efbe}.orange{background:#ffd19e}.purple{background:#ddceff}
.checks{display:grid;gap:6px;margin:9px 0 4px}.check{display:flex;align-items:flex-start;gap:7px;font-size:12.5px;line-height:1.25}.check input{width:17px;height:17px;margin:0;flex:0 0 17px;accent-color:#39342e}.check span.checked{text-decoration:line-through;opacity:.55}.empty{padding:30px 8px;border:2px dashed rgba(70,60,48,.14);border-radius:14px;text-align:center;font-size:12px;color:rgba(48,43,37,.45);font-weight:700}
.drag-ghost{position:fixed!important;z-index:9999;pointer-events:none;width:min(280px,74vw)!important;opacity:.94;transform:rotate(2.1deg) scale(1.045)!important;box-shadow:0 22px 50px rgba(0,0,0,.26)!important;transition:none!important}.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));z-index:10000;transform:translateX(-50%) translateY(18px);opacity:0;pointer-events:none;background:#302d29;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;font-weight:850;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
dialog{border:0;border-radius:22px;padding:0;width:min(94vw,520px);max-height:88vh;box-shadow:0 28px 90px rgba(0,0,0,.28)}dialog::backdrop{background:rgba(0,0,0,.34);backdrop-filter:blur(3px)}.modal{padding:20px;background:#fffdf8;max-height:88vh;overflow:auto}.modal h2{margin:0 0 16px;font-size:24px}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:12px;font-weight:900;color:#6f675c}.field input,.field textarea,.field select{width:100%;min-height:45px;padding:11px 12px;border:1px solid #d6cdbc;border-radius:12px;background:#fff}.field textarea{min-height:100px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.danger{color:#a12727;border-color:#e7baba;background:#fff4f4}.hint{margin-top:9px;font-size:12px;color:#7c7367}.color-row{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.swatch{height:39px;border-radius:11px;border:2px solid transparent}.swatch.active{border-color:#302d29;box-shadow:0 0 0 2px #fff inset}.check-editor{display:grid;gap:8px}.check-edit-row{display:flex;gap:7px}.check-edit-row input{flex:1}.remove-check{width:42px;border:1px solid #ddd2c1;background:#fff;border-radius:11px;font-size:17px}.smallbtn{justify-self:start;border:0;background:#f2ece0;border-radius:10px;padding:8px 10px;font-weight:850}.view-note{display:none}
body.today-focus .column:not([data-column="today"]):not([data-column="progress"]):not([data-column="completed"]){display:none}body.today-focus .board{grid-template-columns:repeat(3,minmax(260px,1fr))}.today-badge{display:none;font-size:11px;padding:3px 7px;border-radius:999px;background:#302d29;color:#fff;font-weight:850}body.today-focus .today-badge{display:inline-block}
@media(max-width:900px){.board{grid-template-columns:repeat(5,80vw)}body.today-focus .board{grid-template-columns:repeat(3,80vw)}.topbar{align-items:flex-start}.brand p{max-width:55vw}.col-head{top:78px}.column{min-height:70vh}.boardbar{align-items:flex-start;flex-wrap:wrap}.seg{order:3}}
@media(min-width:1000px) and (orientation:landscape){.board{grid-template-columns:repeat(5,minmax(190px,1fr));min-width:0}.board-wrap{overflow-x:visible}.column{min-height:79vh}body.today-focus .board{grid-template-columns:repeat(3,minmax(250px,1fr))}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.v5chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.v5chip{font-size:11px;font-weight:800;background:rgba(255,255,255,.58);border:1px solid rgba(0,0,0,.08);padding:3px 6px;border-radius:999px}
.focus-btn{border:0;background:rgba(255,255,255,.68);font-weight:900;border-radius:999px;padding:4px 7px;font-size:11px}
#pomoPanel{position:fixed;right:18px;bottom:18px;z-index:9999;display:none;min-width:245px;padding:15px;border-radius:18px;background:#fffdf5;border:1px solid #ded4bd;box-shadow:0 18px 50px rgba(0,0,0,.22)}
#pomoPanel.on{display:block}#pomoTime{font-size:36px;font-weight:950;margin:4px 0 8px}#pomoTitle{font-weight:900;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pomoPanel .btnrow{display:flex;gap:7px}#pomoPanel button{border:0;border-radius:10px;padding:8px 10px;font-weight:850}

.sync-ui{display:flex;align-items:center;gap:8px;margin-left:auto}.sync-ui #syncStatus{font-size:12px;font-weight:800;opacity:.72}.sync-ui .btn{white-space:nowrap}@media(max-width:700px){.sync-ui #syncStatus{display:none}.sync-ui .btn{padding:8px 10px;font-size:12px}}
#syncStatus{font-size:12px;font-weight:800;opacity:.72;white-space:nowrap}@media(max-width:760px){#syncStatus{display:none}#syncBtn{font-size:12px;padding:8px 10px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand"><h1>Sticky Kanban</h1><p>Like a paper board — made for touch, iPad, and Apple Pencil.</p></div><div class="top-actions"><span id="syncStatus">Local only</span><button class="btn" id="syncBtn" type="button">Sign in to Sync</button><button class="btn icon" id="fullscreenBtn" title="Full screen">⛶</button><button class="btn" id="boardSettingsBtn">Board ⚙︎</button><button class="btn primary" id="newNoteBtn">+ Sticky</button></div></header>
<div class="boardbar"><div class="tabs" id="boardTabs"></div><button class="btn" id="newBoardBtn">+ Board</button><div class="seg"><button id="allViewBtn" class="active">All Board</button><button id="todayViewBtn">Today Focus</button></div></div>
<div class="board-wrap" id="boardWrap"><main class="board" id="columns"></main></div>
</div><div class="toast" id="toast"></div>

<dialog id="noteDialog"><form method="dialog" class="modal" id="noteForm"><h2 id="noteDialogTitle">New Sticky</h2><input type="hidden" id="noteId" />
<div class="field"><label>Title</label><input id="noteTitle" maxlength="80" required placeholder="e.g. HIM 130 Ch. 2 review" /></div>
<div class="field"><label>Details</label><textarea id="noteBody" maxlength="700" placeholder="What do you need to do?"></textarea></div>
<div class="field"><label>Checklist</label><div class="check-editor" id="checkEditor"></div><button type="button" class="smallbtn" id="addCheckBtn">+ checklist item</button></div>
<div class="field"><label>Column</label><select id="noteColumn"></select></div>
<div class="field"><label>Sticky color</label><input type="hidden" id="noteColor" value="yellow" /><div class="color-row" id="colorRow"></div></div>
<div class="field"><label>Due date (optional)</label><input id="noteDue" type="date" /></div>
<div class="field"><label>Due time (optional)</label><input id="noteTime" type="time" /></div>
<div class="field"><label>Reminder</label><select id="noteReminder">
<option value="none">None</option>
<option value="at-time">At due time</option>
<option value="10-min">10 min before</option>
<option value="1-hour">1 hour before</option>
<option value="1-day">1 day before</option>
</select></div>
<div class="field"><label>Repeat</label><select id="noteRepeat">
<option value="none">None</option>
<option value="daily">Daily</option>
<option value="weekly">Weekly</option>
<option value="monthly">Monthly</option>
</select></div>
<div class="field"><label>Pomodoro focus length</label><select id="noteFocus">
<option value="25">25 minutes</option>
<option value="30">30 minutes</option>
<option value="45">45 minutes</option>
<option value="50">50 minutes</option>
</select></div>
<div class="modal-actions"><button type="button" class="btn danger" id="deleteNoteBtn" hidden>Delete</button><button type="button" class="btn" id="cancelNoteBtn">Cancel</button><button class="btn primary">Save</button></div><div class="hint">Hold and drag a sticky to move it. Drop above or below another sticky to reorder it.</div></form></dialog>

<dialog id="boardDialog"><form method="dialog" class="modal" id="boardForm"><h2>New Board</h2><div class="field"><label>Board name</label><input id="boardName" maxlength="40" required placeholder="e.g. School, Kids, Home" /></div><div class="modal-actions"><button type="button" class="btn" id="cancelBoardBtn">Cancel</button><button class="btn primary">Create</button></div></form></dialog>

<dialog id="boardSettingsDialog"><form method="dialog" class="modal" id="boardSettingsForm"><h2>Board Settings</h2><div class="field"><label>Board name</label><input id="renameBoardInput" maxlength="40" required /></div><div class="modal-actions"><button type="button" class="btn danger" id="deleteBoardBtn">Delete Board</button><button type="button" class="btn" id="cancelBoardSettingsBtn">Cancel</button><button class="btn primary">Save Name</button></div><div class="hint">Deleting a board also deletes all sticky notes on that board.</div></form></dialog>
<script>
const COLS=[['todo','To-Dos'],['today','Today’s To-Dos'],['pending','Pending'],['progress','In Progress'],['completed','Completed']];
const COLORS=['yellow','pink','blue','green','orange','purple'];
const KEY='sticky-kanban-v3',LEGACY=['sticky-kanban-v2','sticky-kanban-v1'];
const defaultState={activeBoard:'school',view:'all',boards:[{id:'school',name:'School'},{id:'home',name:'Home'}],notes:[
{id:'n1',board:'school',column:'todo',title:'HIM 130',body:'Chapter 2 & 3\nReview key terms',color:'yellow',due:'',created:Date.now()-3000,order:1000,checks:[{id:'c1',text:'Read notes',done:true},{id:'c2',text:'Active recall',done:false}]},
{id:'n2',board:'school',column:'today',title:'HIM 135',body:'Chapter 2 · 30–45 min study',color:'pink',due:'',created:Date.now()-2000,order:2000,checks:[]},
{id:'n3',board:'school',column:'progress',title:'Wrong-answer review',body:'Redo missed questions before checking answers.',color:'blue',due:'',created:Date.now()-1000,order:3000,checks:[]}
]};
function clone(v){return JSON.parse(JSON.stringify(v))} function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5)}
function load(){try{let raw=localStorage.getItem(KEY);if(!raw)for(const k of LEGACY){raw=localStorage.getItem(k);if(raw)break}const s=raw?JSON.parse(raw):clone(defaultState);s.view=s.view||'all';s.notes=(s.notes||[]).map(n=>({...n,checks:Array.isArray(n.checks)?n.checks:[],time:n.time||'',reminder:n.reminder||'none',repeat:n.repeat||'none',focus:Number(n.focus)||25,pomos:Number(n.pomos)||0}));return s}catch{return clone(defaultState)}}
let state=load();
window.__syncApplying=false;
window.__kanbanGetState=()=>clone(state);
window.__kanbanApplyCloud=(incoming)=>{
  if(!incoming||!Array.isArray(incoming.boards)||!Array.isArray(incoming.notes)) return;
  state=incoming;
  state.view=state.view||'all';
  state.notes=(state.notes||[]).map(n=>({...n,checks:Array.isArray(n.checks)?n.checks:[],time:n.time||'',reminder:n.reminder||'none',repeat:n.repeat||'none',focus:Number(n.focus)||25,pomos:Number(n.pomos)||0}));
  localStorage.setItem(KEY,JSON.stringify(state));
  render();
};
function save(){
  localStorage.setItem(KEY,JSON.stringify(state));
  if(!window.__syncApplying && typeof window.__kanbanCloudSave==='function') window.__kanbanCloudSave(clone(state));
}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function toast(msg){const t=document.querySelector('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1250)}
function activeNotes(column){return state.notes.filter(n=>n.board===state.activeBoard&&n.column===column).sort((a,b)=>(a.order??a.created)-(b.order??b.created))}
function normalizeOrder(column){activeNotes(column).forEach((n,i)=>n.order=(i+1)*1000)}
function render(){document.body.classList.toggle('today-focus',state.view==='today');document.querySelector('#allViewBtn').classList.toggle('active',state.view==='all');document.querySelector('#todayViewBtn').classList.toggle('active',state.view==='today');renderTabs();renderColumns();save()}
function renderTabs(){const el=document.querySelector('#boardTabs');el.innerHTML=state.boards.map(b=>`<button class="tab ${b.id===state.activeBoard?'active':''}" data-board="${b.id}">${esc(b.name)}</button>`).join('');el.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{state.activeBoard=t.dataset.board;render()})}
function renderColumns(){const root=document.querySelector('#columns');root.innerHTML='';COLS.forEach(([id,label])=>{const notes=activeNotes(id);const col=document.createElement('section');col.className='column';col.dataset.column=id;col.innerHTML=`<div class="col-head"><div class="col-title">${label} ${id==='today'?'<span class="today-badge">FOCUS</span>':''}</div><div class="col-tools"><span class="count">${notes.length}</span><button class="mini" data-add="${id}" aria-label="Add">+</button></div></div><div class="notes"></div>`;const list=col.querySelector('.notes');if(!notes.length)list.innerHTML='<div class="empty">Drop sticky notes here</div>';notes.forEach((n,i)=>list.appendChild(noteEl(n,i)));col.querySelector('.mini').onclick=()=>openNew(id);root.appendChild(col)})}
function isOverdue(n){if(!n.due||n.column==='completed')return false;const today=new Date();today.setHours(0,0,0,0);return new Date(n.due+'T00:00:00')<today}
function prettyDue(d,t=''){if(!d&&!t)return'No due date';let s=d?('Due '+new Date(d+'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})):'Due';if(t){const [h,m]=t.split(':').map(Number);const dt=new Date();dt.setHours(h,m,0,0);s+=' · '+dt.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}return s}
function reminderLabel(v){return ({'at-time':'At time','10-min':'10m before','1-hour':'1h before','1-day':'1d before'})[v]||''}
function repeatLabel(v){return ({daily:'Daily',weekly:'Weekly',monthly:'Monthly'})[v]||''}
function noteEl(n,i){const el=document.createElement('article');el.className=`note ${n.color||'yellow'} ${n.column==='completed'?'done':''}`;el.dataset.id=n.id;el.style.setProperty('--rot',`${((n.id.charCodeAt(0)+i)%5-2)*0.32}deg`);const checks=(n.checks||[]).map(c=>`<label class="check"><input type="checkbox" data-check="${c.id}" ${c.done?'checked':''}><span class="${c.done?'checked':''}">${esc(c.text)}</span></label>`).join('');const chips=[];if(n.reminder&&n.reminder!=='none')chips.push(`<span class="v5chip">🔔 ${reminderLabel(n.reminder)}</span>`);if(n.repeat&&n.repeat!=='none')chips.push(`<span class="v5chip">🔁 ${repeatLabel(n.repeat)}</span>`);if(n.pomos)chips.push(`<span class="v5chip">🍅 ${n.pomos}</span>`);el.innerHTML=`<button class="note-menu" aria-label="Edit">•••</button><h3>${esc(n.title)}</h3>${n.body?`<div class="body">${esc(n.body)}</div>`:''}${checks?`<div class="checks">${checks}</div>`:''}<div class="meta"><span class="due ${isOverdue(n)?'overdue':''}">${prettyDue(n.due,n.time)}</span><span>☰ drag</span></div><div class="v5chips">${chips.join('')}<button type="button" class="focus-btn">🍅 Focus</button></div>`;el.querySelector('.note-menu').onclick=e=>{e.stopPropagation();openEdit(n.id)};el.querySelector('.focus-btn').onclick=e=>{e.stopPropagation();startPomodoro(n.id)};el.querySelectorAll('[data-check]').forEach(cb=>cb.addEventListener('change',e=>{e.stopPropagation();const c=n.checks.find(x=>x.id===cb.dataset.check);if(c){c.done=cb.checked;save();renderColumns()}}));attachPointerDrag(el,n.id);return el}
let drag=null;
function attachPointerDrag(el,id){el.addEventListener('pointerdown',e=>{if(e.button!==undefined&&e.button!==0)return;if(e.target.closest('button,input,label'))return;const sx=e.clientX,sy=e.clientY,pid=e.pointerId;let started=false;const timer=setTimeout(()=>start(e),170);function start(ev){if(started)return;started=true;el.setPointerCapture?.(pid);const ghost=el.cloneNode(true);ghost.classList.add('drag-ghost');ghost.querySelectorAll('input').forEach(x=>x.disabled=true);document.body.appendChild(ghost);el.classList.add('drag-source');drag={id,el,ghost};position(ev.clientX,ev.clientY);navigator.vibrate?.(8)}function position(x,y){if(!drag)return;drag.ghost.style.left=(x-drag.ghost.offsetWidth/2)+'px';drag.ghost.style.top=(y-50)+'px';document.querySelectorAll('.column').forEach(c=>c.classList.remove('drop-target'));document.querySelectorAll('.note').forEach(n=>n.classList.remove('drag-before'));const under=document.elementFromPoint(x,y);const col=under?.closest('.column');if(col)col.classList.add('drop-target');const target=under?.closest('.note');if(target&&target.dataset.id!==id)target.classList.add('drag-before');autoScroll(x)}function move(ev){if(!started&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>9){clearTimeout(timer);start(ev)}if(started){ev.preventDefault();position(ev.clientX,ev.clientY)}}function end(ev){clearTimeout(timer);window.removeEventListener('pointermove',move,true);window.removeEventListener('pointerup',end,true);window.removeEventListener('pointercancel',end,true);if(!started)return;const under=document.elementFromPoint(ev.clientX,ev.clientY),col=under?.closest('.column'),target=under?.closest('.note');cleanupDrag();if(col)dropNote(id,col.dataset.column,target?.dataset.id||null,ev.clientY)}function cleanupDrag(){document.querySelectorAll('.column').forEach(c=>c.classList.remove('drop-target'));document.querySelectorAll('.note').forEach(n=>n.classList.remove('drag-before'));drag?.ghost.remove();el.classList.remove('drag-source');drag=null}window.addEventListener('pointermove',move,{capture:true,passive:false});window.addEventListener('pointerup',end,true);window.addEventListener('pointercancel',end,true)},{passive:true})}
function dropNote(id,column,targetId,y){const n=state.notes.find(x=>x.id===id);if(!n)return;const old=n.column;n.column=column;if(old!==column)normalizeOrder(old);let arr=activeNotes(column).filter(x=>x.id!==id);let idx=arr.length;if(targetId){const ti=arr.findIndex(x=>x.id===targetId);if(ti>=0){const targetEl=document.querySelector(`.note[data-id="${targetId}"]`),mid=targetEl?targetEl.getBoundingClientRect().top+targetEl.getBoundingClientRect().height/2:y;idx=ti+(y>mid?1:0)}}arr.splice(idx,0,n);arr.forEach((x,i)=>x.order=(i+1)*1000);render();toast(column==='completed'?'Completed ✓':'Sticky moved')}
function autoScroll(x){const box=document.querySelector('#boardWrap'),r=box.getBoundingClientRect(),edge=70;if(x<r.left+edge)box.scrollLeft-=18;else if(x>r.right-edge)box.scrollLeft+=18}
const noteDialog=document.querySelector('#noteDialog'),noteForm=document.querySelector('#noteForm');function fillCols(){document.querySelector('#noteColumn').innerHTML=COLS.map(([id,l])=>`<option value="${id}">${l}</option>`).join('')}
function renderColors(active='yellow'){const row=document.querySelector('#colorRow');row.innerHTML=COLORS.map(c=>`<button type="button" class="swatch ${c} ${c===active?'active':''}" data-color="${c}" aria-label="${c}"></button>`).join('');row.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>{document.querySelector('#noteColor').value=b.dataset.color;renderColors(b.dataset.color)})}
function addCheckRow(text='',done=false,id=uid()){const row=document.createElement('div');row.className='check-edit-row';row.dataset.id=id;row.dataset.done=done?'1':'0';row.innerHTML=`<input maxlength="120" placeholder="Checklist item" value="${esc(text)}"><button type="button" class="remove-check">×</button>`;row.querySelector('.remove-check').onclick=()=>row.remove();document.querySelector('#checkEditor').appendChild(row)}
document.querySelector('#addCheckBtn').onclick=()=>addCheckRow();function collectChecks(){return [...document.querySelectorAll('#checkEditor .check-edit-row')].map(r=>({id:r.dataset.id,text:r.querySelector('input').value.trim(),done:r.dataset.done==='1'})).filter(x=>x.text)}
function openNew(column='todo'){fillCols();noteForm.reset();document.querySelector('#noteId').value='';document.querySelector('#noteReminder').value='none';document.querySelector('#noteRepeat').value='none';document.querySelector('#noteFocus').value='25';document.querySelector('#noteColumn').value=column;document.querySelector('#noteColor').value='yellow';document.querySelector('#checkEditor').innerHTML='';renderColors('yellow');document.querySelector('#deleteNoteBtn').hidden=true;document.querySelector('#noteDialogTitle').textContent='New Sticky';noteDialog.showModal();setTimeout(()=>document.querySelector('#noteTitle').focus(),60)}
function openEdit(id){fillCols();const n=state.notes.find(x=>x.id===id);if(!n)return;document.querySelector('#noteId').value=n.id;document.querySelector('#noteTitle').value=n.title;document.querySelector('#noteBody').value=n.body||'';document.querySelector('#noteColumn').value=n.column;document.querySelector('#noteColor').value=n.color||'yellow';document.querySelector('#noteDue').value=n.due||'';document.querySelector('#noteTime').value=n.time||'';document.querySelector('#noteReminder').value=n.reminder||'none';document.querySelector('#noteRepeat').value=n.repeat||'none';document.querySelector('#noteFocus').value=String(n.focus||25);document.querySelector('#checkEditor').innerHTML='';(n.checks||[]).forEach(c=>addCheckRow(c.text,c.done,c.id));renderColors(n.color||'yellow');document.querySelector('#deleteNoteBtn').hidden=false;document.querySelector('#noteDialogTitle').textContent='Edit Sticky';noteDialog.showModal()}
noteForm.addEventListener('submit',e=>{e.preventDefault();const id=document.querySelector('#noteId').value,data={title:document.querySelector('#noteTitle').value.trim(),body:document.querySelector('#noteBody').value.trim(),column:document.querySelector('#noteColumn').value,color:document.querySelector('#noteColor').value,due:document.querySelector('#noteDue').value,time:document.querySelector('#noteTime').value,reminder:document.querySelector('#noteReminder').value,repeat:document.querySelector('#noteRepeat').value,focus:Number(document.querySelector('#noteFocus').value)||25,checks:collectChecks()};if(!data.title)return;if(id){const n=state.notes.find(n=>n.id===id),old=n.column;Object.assign(n,data);if(old!==data.column){normalizeOrder(old);n.order=Date.now()}}else state.notes.push({id:uid(),board:state.activeBoard,created:Date.now(),order:Date.now(),...data});noteDialog.close();render();toast(id?'Updated':'Sticky added')});
document.querySelector('#deleteNoteBtn').onclick=()=>{const id=document.querySelector('#noteId').value;if(id&&confirm('Delete this sticky note?')){state.notes=state.notes.filter(n=>n.id!==id);noteDialog.close();render();toast('Deleted')}};document.querySelector('#cancelNoteBtn').onclick=()=>noteDialog.close();document.querySelector('#newNoteBtn').onclick=()=>openNew('todo');
const boardDialog=document.querySelector('#boardDialog');document.querySelector('#newBoardBtn').onclick=()=>{document.querySelector('#boardForm').reset();boardDialog.showModal();setTimeout(()=>document.querySelector('#boardName').focus(),60)};document.querySelector('#cancelBoardBtn').onclick=()=>boardDialog.close();document.querySelector('#boardForm').onsubmit=e=>{e.preventDefault();const name=document.querySelector('#boardName').value.trim();if(!name)return;const id=uid();state.boards.push({id,name});state.activeBoard=id;boardDialog.close();render();toast('Board created')};
const bs=document.querySelector('#boardSettingsDialog');document.querySelector('#boardSettingsBtn').onclick=()=>{const b=state.boards.find(x=>x.id===state.activeBoard);document.querySelector('#renameBoardInput').value=b?.name||'';document.querySelector('#deleteBoardBtn').disabled=state.boards.length<=1;bs.showModal()};document.querySelector('#cancelBoardSettingsBtn').onclick=()=>bs.close();document.querySelector('#boardSettingsForm').onsubmit=e=>{e.preventDefault();const b=state.boards.find(x=>x.id===state.activeBoard),name=document.querySelector('#renameBoardInput').value.trim();if(b&&name)b.name=name;bs.close();render();toast('Board renamed')};document.querySelector('#deleteBoardBtn').onclick=()=>{if(state.boards.length<=1)return;const b=state.boards.find(x=>x.id===state.activeBoard);if(confirm(`Delete “${b.name}” and all its sticky notes?`)){state.notes=state.notes.filter(n=>n.board!==b.id);state.boards=state.boards.filter(x=>x.id!==b.id);state.activeBoard=state.boards[0].id;bs.close();render();toast('Board deleted')}};
document.querySelector('#allViewBtn').onclick=()=>{state.view='all';render()};document.querySelector('#todayViewBtn').onclick=()=>{state.view='today';render();document.querySelector('#boardWrap').scrollLeft=0};document.querySelector('#fullscreenBtn').onclick=async()=>{try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else if(document.exitFullscreen)await document.exitFullscreen()}catch{toast('Use Add to Home Screen for full-screen app mode')}};

const pomoPanel=document.createElement('div');pomoPanel.id='pomoPanel';pomoPanel.innerHTML=`<div id="pomoTitle">🍅 Focus</div><div id="pomoTime">25:00</div><div class="btnrow"><button id="pomoPause">Pause</button><button id="pomoStop">Stop</button></div>`;document.body.appendChild(pomoPanel);
let pomoTimer=null,pomoLeft=0,pomoNoteId=null;
function pomoDraw(){document.querySelector('#pomoTime').textContent=String(Math.floor(pomoLeft/60)).padStart(2,'0')+':'+String(pomoLeft%60).padStart(2,'0')}
function startPomodoro(id){const n=state.notes.find(x=>x.id===id);if(!n)return;clearInterval(pomoTimer);pomoNoteId=id;pomoLeft=(Number(n.focus)||25)*60;document.querySelector('#pomoTitle').textContent='🍅 '+n.title;pomoPanel.classList.add('on');pomoDraw();pomoTimer=setInterval(pomoTick,1000);document.querySelector('#pomoPause').textContent='Pause'}
function pomoTick(){pomoLeft--;pomoDraw();if(pomoLeft<=0){clearInterval(pomoTimer);pomoTimer=null;const n=state.notes.find(x=>x.id===pomoNoteId);if(n){n.pomos=(n.pomos||0)+1;save();renderColumns()}pomoPanel.classList.remove('on');toast('Focus session complete 🍅')}}
document.querySelector('#pomoPause').onclick=()=>{if(pomoTimer){clearInterval(pomoTimer);pomoTimer=null;document.querySelector('#pomoPause').textContent='Resume'}else{pomoTimer=setInterval(pomoTick,1000);document.querySelector('#pomoPause').textContent='Pause'}};
document.querySelector('#pomoStop').onclick=()=>{clearInterval(pomoTimer);pomoTimer=null;pomoPanel.classList.remove('on')};

render();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
